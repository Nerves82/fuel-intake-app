# Builds, tests and packages the Windows desktop app on GitHub's Windows machines.
# Every push produces a downloadable zip (Actions run page -> Artifacts).
# Every push to main (i.e. every merged pull request) also publishes a GitHub Release, so the newest
# approved build is always at:
#   https://github.com/Nerves82/fuel-intake-app/releases/latest/download/FuelIntake-win-x64.zip
# Pushing a tag like v1.0.0 publishes a release with that version number instead.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to create releases on tags

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          else { $v = "0.1.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "info=$v ($sha)" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore FuelIntake.sln

      - name: Build
        run: dotnet build FuelIntake.sln -c Release --no-restore "-p:Version=${{ steps.ver.outputs.version }}" "-p:InformationalVersion=${{ steps.ver.outputs.info }}"

      - name: Test
        run: dotnet test FuelIntake.sln -c Release --no-build --logger "console;verbosity=normal" --logger GitHubActions

      - name: Publish desktop app (self-contained, win-x64)
        run: >
          dotnet publish src/FuelIntake.Desktop/FuelIntake.Desktop.csproj -c Release -r win-x64 --self-contained true
          "-p:Version=${{ steps.ver.outputs.version }}" "-p:InformationalVersion=${{ steps.ver.outputs.info }}"
          -o "publish/FuelIntake-${{ steps.ver.outputs.version }}"

      - name: Zip
        shell: pwsh
        run: |
          # the zip holds a versioned folder: FuelIntake-0.1.29-win-x64.zip -> FuelIntake-0.1.29\FuelIntake.exe
          Compress-Archive -Path "publish/FuelIntake-${{ steps.ver.outputs.version }}" -DestinationPath "FuelIntake-${{ steps.ver.outputs.version }}-win-x64.zip"
          # same file under a fixed name, so ".../releases/latest/download/FuelIntake-win-x64.zip" always works
          Copy-Item "FuelIntake-${{ steps.ver.outputs.version }}-win-x64.zip" "FuelIntake-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: FuelIntake-${{ steps.ver.outputs.version }}-win-x64
          path: publish/   # keeps the versioned folder inside the download
          retention-days: 30

      - name: Publish release (main and version tags only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v${{ steps.ver.outputs.version }}" }
          gh release create $tag "FuelIntake-win-x64.zip" "FuelIntake-${{ steps.ver.outputs.version }}-win-x64.zip" `
            --target "${{ github.sha }}" --title "Fuel Intake $tag" --generate-notes --latest
